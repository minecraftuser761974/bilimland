<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        @keyframes winDots {
            0% { transform: translateX(0); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateX(35px); opacity: 0; }
        }
        .win-dot { animation: winDots 1.4s infinite ease-in-out; }
        .win-dot:nth-child(2) { animation-delay: 0.2s; }
        .win-dot:nth-child(3) { animation-delay: 0.4s; }
        .win-dot:nth-child(4) { animation-delay: 0.6s; }
        .win-dot:nth-child(5) { animation-delay: 0.8s; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-indigo-600 selection:text-white">

    <!-- 1. WINDOWS 10 BOOT SCREEN -->
    <div id="boot-screen" class="fixed inset-0 z-50 bg-slate-950 flex flex-col items-center justify-center transition-opacity duration-700">
        <div class="text-center">
            <h1 class="text-3xl font-semibold tracking-wider text-white mb-8">BilimAL</h1>
            <div class="flex space-x-2 justify-center items-center w-24 h-6 relative overflow-hidden">
                <div class="w-2.5 h-2.5 bg-indigo-500 rounded-full absolute win-dot"></div>
                <div class="w-2.5 h-2.5 bg-indigo-500 rounded-full absolute win-dot"></div>
                <div class="w-2.5 h-2.5 bg-indigo-500 rounded-full absolute win-dot"></div>
                <div class="w-2.5 h-2.5 bg-indigo-500 rounded-full absolute win-dot"></div>
                <div class="w-2.5 h-2.5 bg-indigo-500 rounded-full absolute win-dot"></div>
            </div>
            <p class="text-xs text-slate-400 mt-8 tracking-wide">Жүйе жүктелуде...</p>
        </div>
    </div>

    <!-- 2. BILIMPUSH TOAST CONTAINER -->
    <div id="push-container" class="fixed top-5 right-5 z-50 flex flex-col space-y-3 pointer-events-none"></div>

    <!-- 3. MAIN CONTAINER -->
    <div id="app" class="flex-1 flex flex-col"></div>

    <!-- SCRIPT LOGIC -->
    <script>
        // Firebase Configuration (Real-time Cloud Database)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "bilimal-app.firebaseapp.com",
            databaseURL: "https://bilimal-default-rtdb.firebaseio.com",
            projectId: "bilimal-app",
            storageBucket: "bilimal-app.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:1234:web:abcd"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // BilimPush Notification System (Кіру, сақтау, жариялау, өзгерту)
        function showPush(message, type = 'success') {
            const container = document.getElementById('push-container');
            const toast = document.createElement('div');
            
            const bgColor = type === 'success' ? 'bg-emerald-950/90 border-emerald-500/50 text-emerald-200' : 'bg-rose-950/90 border-rose-500/50 text-rose-200';
            const iconSvg = type === 'success' 
                ? '<svg class="w-5 h-5 text-emerald-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>'
                : '<svg class="w-5 h-5 text-rose-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>';

            toast.className = `pointer-events-auto flex items-center justify-between w-80 p-4 rounded-xl border backdrop-blur-md shadow-2xl transition-all duration-300 transform translate-y-[-20px] opacity-0 ${bgColor}`;
            toast.innerHTML = `
                <div class="flex items-center space-x-3">
                    ${iconSvg}
                    <span class="text-sm font-medium">${message}</span>
                </div>
                <button onclick="this.parentElement.remove()" class="text-slate-400 hover:text-white text-lg font-bold ml-2">&times;</button>
            `;

            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-[-20px]', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('translate-y-[-20px]', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 4500);
        }

        let currentUser = null;

        // Boot screen finish
        window.addEventListener('load', () => {
            setTimeout(() => {
                const boot = document.getElementById('boot-screen');
                if (boot) {
                    boot.classList.add('opacity-0');
                    setTimeout(() => boot.remove(), 700);
                }
                renderLanding();
            }, 4000);
        });

        // Landing & Pure Login View
        function renderLanding() {
            const app = document.getElementById('app');

                            <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white text-lg">B</div>
                            <span class="text-xl font-bold tracking-tight text-white">BilimAL</span>
                        </div>
                        <button onclick="scrollToLogin()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2 rounded-lg text-sm font-medium transition">Жүйеге кіру</button>
                    </header>

                    <section class="max-w-6xl mx-auto px-6 py-16 text-center">
                        <h1 class="text-4xl md:text-5xl font-bold text-white tracking-tight mb-4">BilimAL — Кәсіби білім беру платформасы</h1>
                        <p class="text-slate-400 text-base max-w-2xl mx-auto mb-10">Электронды журнал, сыныптарды басқару, үй тапсырмалары мен бұлттық аналитика жүйесі.</p>
                    </section>

                    <!-- Informative Blocks -->
                    <section class="max-w-6xl mx-auto px-6 pb-12 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                        <div class="bg-slate-950 border border-slate-800/80 p-6 rounded-2xl">
                            <div class="w-10 h-10 rounded-lg bg-indigo-600/20 text-indigo-400 flex items-center justify-center font-bold mb-4">01</div>

                            <p class="text-sm text-slate-400">Мектептерге арналған толықтай бұлттық (Firebase) негізде жұмыс істейтін заманауи журнал.</p>

                            <h3 class="text-lg font-semibold text-white mb-2">Оқушы & Ата-ана</h3>
                            <p class="text-sm text-slate-400">Үй жұмысына файл тіркеп жіберу, Notify модулі арқылы мұғаліммен жеке хат алмасу.</p>
                        </div>
                        <div class="bg-slate-950 border border-slate-800/80 p-6 rounded-2xl">
                            <div class="w-10 h-10 rounded-lg bg-indigo-600/20 text-indigo-400 flex items-center justify-center font-bold mb-4">04</div>
                            <h3 class="text-lg font-semibold text-white mb-2">Бас әкімші</h3>
                            <p class="text-sm text-slate-400">BilimAnalytics арқылы сыныптар мен ортақ білім көрсеткішін қадағалау.</p>
                        </div>
                    </section>

                    <!-- Pure Login Form (No dropdowns, no official state fluff) -->
                    <section id="login-section" class="max-w-md mx-auto w-full px-6 py-12">
                        <div class="bg-slate-950 border border-slate-800 p-8 rounded-2xl shadow-2xl">
                            <h2 class="text-2xl font-bold text-white mb-2 text-center">Жүйеге кіру</h2>
                            <p class="text-xs text-slate-400 text-center mb-6">Логин мен пароліңізді енгізіңіз</p>
                            
                            <form onsubmit="handleLogin(event)" class="space-y-4">
                                <div>
                                    <label class="block text-xs font-medium text-slate-400 mb-1">Логин</label>
                                    <input type="text" id="login-username" required class="w-full bg-slate-900 border border-slate-800 rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500" placeholder="admin, teacher, student, parent">

                                    <input type="password" id="login-password" required class="w-full bg-slate-900 border border-slate-800 rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500" placeholder="••••••••">
                                </div>
                                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-lg transition shadow-lg shadow-indigo-600/20">Кіру</button>
                            </form>
                        </div>
                    </section>

                    <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500">
                        &copy; 2026 BilimAL. Барлық құқықтар қорғалған.
                    </footer>
                </div>
            `;
        }

        function scrollToLogin() {
            document.getElementById('login-section').scrollIntoView({ behavior: 'smooth' });
        }

        // Authentication Handler with BilimPush
        function handleLogin(e) {
            e.preventDefault();
            const user = document.getElementById('login-username').value.trim();
            const pass = document.getElementById('login-password').value.trim();

            if (user === 'admin' && pass === 'admin') {
                currentUser = { name: 'Бас Әкімші', role: 'admin' };
                showPush('Сәтті! Қош келдіңіз, Әкімші', 'success');
                renderDashboard('admin');
            } else if (user === 'teacher' && pass === 'teacher') {
                currentUser = { name: 'Мұғалім А.', role: 'teacher' };
                showPush('Сәтті! Қош келдіңіз, Мұғалім', 'success');
                renderDashboard('teacher');
            } else if (user === 'student' && pass === 'student') {
                currentUser = { name: 'Оқушы Б.', role: 'student' };
                showPush('Сәтті! Қош келдіңіз, Оқушы', 'success');
                renderDashboard('student');
            } else if (user === 'parent' && pass === 'parent') {
                currentUser = { name: 'Ата-ана С.', role: 'parent' };
                showPush('Сәтті! Қош келдіңіз, Ата-ана', 'success');
                renderDashboard('parent');
            } else {
                showPush('Сәтсіз! Пароль немесе логин қате енгізілген', 'error');
            }
        }

        // Dashboard Router
        function renderDashboard(role) {
            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="flex h-screen bg-slate-900 overflow-hidden">
                    <aside class="w-64 bg-slate-950 border-r border-slate-800 flex flex-col justify-between">
                        <div>
                            <div class="p-6 border-b border-slate-800 flex items-center space-x-3">
                                <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white">B</div>

                            </div>

                        </div>

                            </div>
                            <button onclick="logout()" class="w-full bg-slate-900 hover:bg-slate-800 text-slate-300 text-xs py-2 rounded-lg border border-slate-800 transition">Шығу</button>
                        </div>
                    </aside>
                    <main class="flex-1 flex flex-col overflow-y-auto" id="main-content"></main>
                </div>
            `;
            setupSidebarNav(role);
        }

        function logout() {
            currentUser = null;
            showPush('Жүйеден сәтті шықтыңыз', 'success');
            renderLanding();
        }

        function setupSidebarNav(role) {
            const nav = document.getElementById('sidebar-nav');
            let links = [];

            if (role === 'admin') {
                links = [
                    { name: 'BilimAnalytics', action: 'renderAdminAnalytics' },
                    { name: 'BilimSubscription', action: 'renderAdminSubscription' }
                ];
            } else if (role === 'teacher') {
                links = [
                    { name: 'BilimTask (Тапсырма беру)', action: 'renderTeacherTask' },
                    { name: 'CheckTask (Тексеру)', action: 'renderTeacherCheckTask' },
                    { name: 'Notify (Хабарламалар)', action: 'renderTeacherNotify' }
                ];
            } else if (role === 'student') {
                links = [
                    { name: 'BilimTask (Үй жұмысы)', action: 'renderStudentTask' },
                    { name: 'Notify (Мұғалімге жазу)', action: 'renderStudentNotify' }
                ];
            } else if (role === 'parent') {
                links = [
                    { name: 'BilimTask (Тапсырмалар)', action: 'renderParentTask' }
                ];
            }

            nav.innerHTML = links.map((l, i) => `
                <button onclick="${l.action}()" class="w-full text-left px-4 py-2.5 rounded-lg text-sm font-medium transition ${i === 0 ? 'bg-indigo-600/10 text-indigo-400 border border-indigo-500/20' : 'text-slate-400 hover:bg-slate-900 hover:text-white'}">
                    ${l.name}
                </button>
            `).join('');

            if (links.length > 0) window[links[0].action]();
        }

        function renderStudentNotify() {
